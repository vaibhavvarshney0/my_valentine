<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0;padding:0;background-color:#fff0f5;font-family:Arial,sans-serif;">
    <div style="max-width:600px;margin:40px auto;background:linear-gradient(135deg,#ff6b9d 0%,#c44569 100%);border-radius:20px;padding:0;">

        <!-- Header -->
        <div style="padding:40px 40px 20px;text-align:center;">
            <div style="font-size:60px;margin-bottom:10px;">💝</div>
            <h1 style="color:#ffffff;margin:0;font-size:32px;font-weight:600;">Hey Buddhu! 💕</h1>
        </div>

        <!-- Content Card -->
        <div style="padding:0 40px 40px;">
            <div style="background:#ffffff;border-radius:15px;padding:40px 30px;text-align:center;">
                <p style="color:#333333;font-size:18px;line-height:1.6;margin:0 0 20px;">
                    I made something special just for you... 🎁
                </p>
                <p style="color:#666666;font-size:16px;line-height:1.6;margin:0 0 30px;">
                    It's a little surprise that comes straight from my heart. ✨
                </p>

                <!-- Button -->
                <div style="margin:0 0 25px;">
                    <a href="YOUR_WEBSITE_LINK_HERE" style="display:inline-block;padding:18px 50px;background:linear-gradient(135deg,#ff6b9d,#c44569);color:#ffffff;text-decoration:none;font-size:18px;font-weight:600;border-radius:50px;">
                        Open Your Surprise 💖
                    </a>
                </div>

                <p style="color:#999999;font-size:14px;margin:0;font-style:italic;">
                    (Trust me, you're going to love this!) 😊
                </p>
            </div>
        </div>

        <!-- Hearts -->
        <div style="padding:0 40px 30px;text-align:center;">
            <div style="color:#ffffff;font-size:24px;letter-spacing:10px;opacity:0.8;">
                💕 💖 💕 💖 💕
            </div>
        </div>

        <!-- Footer -->
        <div style="padding:20px 40px 40px;text-align:center;">
            <p style="color:rgba(255,255,255,0.9);font-size:14px;margin:0;line-height:1.6;">
                With all my love,<br>
                <span style="font-size:16px;font-weight:600;">Your Valentine 💝</span>
            </p>
        </div>
    </div>

    <!-- PS -->
    <div style="max-width:600px;margin:20px auto;text-align:center;padding:20px;">
        <p style="color:#c44569;font-size:14px;margin:0;font-style:italic;">
            P.S. Make sure you have some time... you'll want to enjoy this! 🌹
        </p>
    </div>
</body>
</html>
