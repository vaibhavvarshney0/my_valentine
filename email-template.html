<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message for You 💕</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Arial', sans-serif; background-color: #fff0f5;">
    <table role="presentation" style="width: 100%; border-collapse: collapse;">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table role="presentation" style="width: 600px; max-width: 100%; border-collapse: collapse; background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%); border-radius: 20px; box-shadow: 0 10px 40px rgba(196, 69, 105, 0.3);">
                    <!-- Header with hearts -->
                    <tr>
                        <td style="padding: 40px 40px 20px; text-align: center;">
                            <div style="font-size: 60px; line-height: 1; margin-bottom: 10px;">
                                💝
                            </div>
                            <h1 style="color: white; margin: 0; font-size: 32px; font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,0.2);">
                                Hey Buddhu! 💕
                            </h1>
                        </td>
                    </tr>

                    <!-- Main content card -->
                    <tr>
                        <td style="padding: 0 40px 40px;">
                            <table role="presentation" style="width: 100%; border-collapse: collapse; background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1);">
                                <tr>
                                    <td style="padding: 40px 30px; text-align: center;">
                                        <p style="color: #333; font-size: 18px; line-height: 1.6; margin: 0 0 20px;">
                                            I made something special just for you... 🎁
                                        </p>
                                        <p style="color: #666; font-size: 16px; line-height: 1.6; margin: 0 0 30px;">
                                            It's a little surprise that comes straight from my heart. ✨
                                        </p>

                                        <!-- CTA Button -->
                                        <table role="presentation" style="margin: 0 auto; border-collapse: collapse;">
                                            <tr>
                                                <td style="border-radius: 50px; background: linear-gradient(135deg, #ff6b9d, #c44569); box-shadow: 0 4px 15px rgba(196, 69, 105, 0.4);">
                                                    <a href="YOUR_WEBSITE_LINK_HERE" style="display: inline-block; padding: 18px 50px; color: white; text-decoration: none; font-size: 18px; font-weight: 600; letter-spacing: 0.5px;">
                                                        Open Your Surprise 💖
                                                    </a>
                                                </td>
                                            </tr>
                                        </table>

                                        <p style="color: #999; font-size: 14px; margin: 25px 0 0; font-style: italic;">
                                            (Trust me, you're going to love this!) 😊
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Hearts decoration -->
                    <tr>
                        <td style="padding: 0 40px 30px; text-align: center;">
                            <div style="color: white; font-size: 24px; letter-spacing: 10px; opacity: 0.8;">
                                💕 💖 💕 💖 💕
                            </div>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 20px 40px 40px; text-align: center;">
                            <p style="color: rgba(255, 255, 255, 0.9); font-size: 14px; margin: 0; line-height: 1.6;">
                                With all my love,<br>
                                <span style="font-size: 16px; font-weight: 600;">Your Valentine 💝</span>
                            </p>
                        </td>
                    </tr>
                </table>

                <!-- PS Section -->
                <table role="presentation" style="width: 600px; max-width: 100%; margin-top: 20px;">
                    <tr>
                        <td style="text-align: center; padding: 20px;">
                            <p style="color: #c44569; font-size: 14px; margin: 0; font-style: italic;">
                                P.S. Make sure you have some time... you'll want to enjoy this! 🌹
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
